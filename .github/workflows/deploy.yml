name: Check and deploy WordPress theme
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: theme-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check repository scope
        shell: bash
        run: |
          set -euo pipefail
          invalid_files="$(git ls-files | grep -Ev '^(\.gitattributes|\.gitignore|README\.md|\.github/|wp-content/themes/cybercentauri 2/)' || true)"
          if [[ -n "$invalid_files" ]]; then
            echo "These files are outside the deployable theme and must not be committed:"
            printf '%s\n' "$invalid_files"
            exit 1
          fi
      - name: Check PHP syntax
        run: find 'wp-content/themes/cybercentauri 2' -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
  deploy:
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Upload active theme
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '21098' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          WP_ROOT: ${{ secrets.WP_ROOT }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PORT SSH_PRIVATE_KEY SSH_KNOWN_HOSTS WP_ROOT; do
            test -n "${!name}" || { echo "Missing configuration: $name"; exit 1; }
          done
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$WP_ROOT" =~ ^/home/[a-zA-Z0-9_]+/[a-zA-Z0-9_./-]+$ ]]
          [[ "$WP_ROOT" != *'..'* ]]
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf -- "$key_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          export RSYNC_RSH="ssh -i $key_dir/key -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$key_dir/known_hosts"
          rsync -rlcz --delay-updates --protect-args --itemize-changes --backup \
            --backup-dir="/home/$SSH_USER/deployment-backups/github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            'wp-content/themes/cybercentauri 2/' \
            "$SSH_USER@$SSH_HOST:${WP_ROOT%/}/wp-content/themes/cybercentauri 2/"
